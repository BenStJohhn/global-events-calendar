# Sky & nature: eclipses (from timeanddate UK list), aurora/NLC windows and UK wildlife seasons.
# Moons, equinoxes, meteor showers, oppositions and clock changes are computed in generator/sky.py.

# ---------------- Eclipses ----------------
- title: "Penumbral lunar eclipse"
  start: 2027-02-20
  location: "Visible across the UK"
  url: https://www.timeanddate.com/eclipse/in/uk
  hook: "The Moon slips into Earth's faint outer shadow. It's a subtle dusky shading on one side rather than a red 'blood moon', but it's a nice excuse to look up, and it's the warm-up for the eclipse season ahead."
  notes: "Penumbral eclipses are subtle; best seen near maximum. Check timeanddate for exact local times."
- title: "Total solar eclipse: SPAIN · MOROCCO · EGYPT (partial ~35% from UK)"
  start: 2027-08-02
  location: "Totality path: Cádiz/Tarifa, Gibraltar, northern Morocco, Tunisia, Libya, Luxor (Egypt)"
  geo: [36.0143, -5.6044]
  url: https://www.timeanddate.com/eclipse/solar/2027-august-2
  trip: true
  hook: "The eclipse of the decade. Totality reaches about 6 m 23 s near Luxor, one of the longest totalities over land this century. The path of darkness crosses southern Spain and the Strait of Gibraltar, so Tarifa or Cádiz is a cheap flight away. You get midday darkness, stars, the corona and a 360° sunset. From the UK it's only a ~35% partial (around 09:00–11:00 BST). Go to the path. Do not miss this."
  notes: "Rule exception, approved by you: not fully visible from the UK, but it's a ✈️ priority. Book accommodation in the path EARLY, because it will sell out. Proper ISO 12312-2 eclipse glasses are essential for the partial phases."
- title: "Partial solar eclipse from the UK (~35%)"
  start: 2027-08-02T10:00
  tz: Europe/London
  duration: 120
  location: "Visible across the UK (south-east ~35%)"
  url: https://www.timeanddate.com/eclipse/in/uk
  hook: "If you can't make it to Spain, the Moon still takes a decent bite out of the morning Sun across the UK, around 09:00–11:00 BST with maximum near 10:00. Use eclipse glasses or a pinhole projector, never look directly."
  notes: "Times approximate for southern England; varies by a few minutes across the UK."
- title: "Penumbral lunar eclipse (morning, Moon setting)"
  start: 2027-08-17
  location: "Visible across the UK (low in the west at dawn)"
  url: https://www.timeanddate.com/eclipse/in/uk
  hook: "A subtle shading of the setting Moon low in the west around dawn. A photo opportunity if you have a clear western horizon."
- title: "Partial lunar eclipse: ~90% of the Moon in shadow"
  start: 2028-01-12T04:03
  tz: Europe/London
  duration: 90
  location: "Visible across the UK"
  url: https://www.timeanddate.com/eclipse/in/uk
  hook: "A deep partial eclipse. Around 90% of the Moon dives into Earth's dark umbra, turning a coppery red with just a bright sliver left. The best lunar eclipse from the UK in this window. Set an alarm; it's worth it."
  notes: "Visible roughly 02:30–05:30 GMT; maximum ~04:03 GMT."
- title: "Partial solar eclipse at sunset (~45%)"
  start: 2028-01-26T16:40
  tz: Europe/London
  duration: 90
  location: "Visible across the UK (west favoured)"
  url: https://www.timeanddate.com/eclipse/in/uk
  hook: "An annular eclipse elsewhere that's seen from the UK as a partial, low in the south-west as the Sun sets. A crescent Sun setting over the sea is a dream photo; head to a west-facing coast like Pembrokeshire or Cornwall."
  notes: "Maximum ~16:40 GMT; the Sun is very low, so you need a clear south-west horizon. Use eclipse glasses."

# ---------------- Aurora & night-sky seasons ----------------
- title: "Aurora watch: equinox boost window"
  rule: {type: fixed, month: 3, day: 10, days: 1}
  status: estimated
  location: "Northern Scotland best; often visible further south during storms"
  geo: [58.5, -3.5]
  url: https://aurorawatch.lancs.ac.uk
  hook: "Geomagnetic storms are statistically more likely in the weeks around the equinoxes, because of how Earth's field lines up with the solar wind. Get AuroraWatch UK alerts on your phone and take every clear night seriously."
  notes: "Statistical window (late Feb–early April), not a forecast."
- title: "Aurora watch: equinox boost window"
  rule: {type: fixed, month: 9, day: 10, days: 1}
  status: estimated
  location: "Northern Scotland best; often visible further south during storms"
  geo: [58.5, -3.5]
  url: https://aurorawatch.lancs.ac.uk
  hook: "Autumn equinox storm season, and the nights are dark again. Your phone camera sees aurora better than your eyes do."
  notes: "Statistical window (late Aug–early Oct), not a forecast."
- title: "Noctilucent cloud season begins"
  rule: {type: fixed, month: 5, day: 25, days: 1}
  status: estimated
  location: "Northern horizon, best from Scotland & northern England"
  hook: "Electric-blue night-shining clouds 80 km up, the highest clouds on Earth, glowing in the northern sky long after sunset. Season runs to early August, peaking mid-June to mid-July."
- title: "Milky Way core season begins"
  rule: {type: fixed, month: 4, day: 15, days: 1}
  status: estimated
  location: "Dark-sky sites: Exmoor, Brecon Beacons, Galloway, Northumberland"
  hook: "The bright galactic core starts rising in the small hours. Time trips with new moons; by July and August it's up at a civilised hour, low in the south."

